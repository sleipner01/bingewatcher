name: Set up Bun
description: Install Bun and the dependencies for the given workspaces, with a cached package store

inputs:
  filter:
    description: Workspace filters for bun install, separated by spaces. Installs every workspace when empty.
    default: ''

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: |
        filters=()
        for workspace in ${{ inputs.filter }}; do filters+=(--filter "$workspace"); done
        bun install --frozen-lockfile "${filters[@]}"
